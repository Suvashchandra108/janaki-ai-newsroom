name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql+psycopg://janaki_app:app_dev_pw@localhost:5432/janaki_test
      TEST_DATABASE_OWNER_URL: postgresql+psycopg://janaki_owner:owner_dev_pw@localhost:5432/janaki_test
      DATABASE_OWNER_URL: postgresql+psycopg://janaki_owner:owner_dev_pw@localhost:5432/janaki_test
      LIVE_FETCH: "1"
      # Optional: set repository secret GEMINI_API_KEY (and optionally variable GEMINI_MODEL)
      # to run one real Gemini claim-extraction test. Skipped when absent.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create database roles (owner + RLS-enforced app role)
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE janaki_owner LOGIN PASSWORD 'owner_dev_pw';
          CREATE ROLE janaki_app LOGIN PASSWORD 'app_dev_pw' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE janaki_test OWNER janaki_owner;
          SQL
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Migrations match models
        run: alembic upgrade head && alembic check
      - name: Tests (incl. live RSS fetch)
        run: pytest -p no:warnings --cov=app --cov-report=term -rs
      - name: Live Gemini check (details)
        if: env.GEMINI_API_KEY != ''
        run: pytest -p no:warnings -s tests/test_live_ai.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  dashboard-e2e:
    # Real browser against the real API and a seeded throwaway database.
    # Pinned: Playwright 1.58 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://janaki_app:app_dev_pw@localhost:5432/janaki_e2e
      TEST_DATABASE_OWNER_URL: postgresql+psycopg://janaki_owner:owner_dev_pw@localhost:5432/janaki_e2e
      DATABASE_URL: postgresql+psycopg://janaki_app:app_dev_pw@localhost:5432/janaki_e2e
      DATABASE_OWNER_URL: postgresql+psycopg://janaki_owner:owner_dev_pw@localhost:5432/janaki_e2e
      STORAGE_LOCAL_ROOT: /tmp/e2e-media
      NEWSROOM_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Database roles
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE janaki_owner LOGIN PASSWORD 'owner_dev_pw';
          CREATE ROLE janaki_app LOGIN PASSWORD 'app_dev_pw' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE janaki_e2e OWNER janaki_owner;
          SQL
      - name: Backend install and seed
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          python -m tests.e2e_seed > ../frontend/seed.json
      - name: Start API
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Build and start dashboard
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          PORT=3100 HOSTNAME=127.0.0.1 COOKIE_SECURE=false nohup node .next/standalone/server.js > /tmp/dash.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3100/login && break; sleep 1; done
      - name: Browser tests
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:3100
          SEED_FILE: seed.json
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
      - name: Server logs on failure
        if: failure()
        run: tail -100 /tmp/api.log /tmp/dash.log

  deploy-smoke:
    # Builds the production images and starts deploy/docker-compose.prod.yml exactly as the
    # server will (Caddy on plain http here, since CI has no domain), then signs in.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Production settings for the smoke test
        run: |
          cp deploy/.env.production.example deploy/.env.production
          gen() { openssl rand -base64 48 | tr -d '\n/+=' | cut -c1-48; }
          fernet=$(openssl rand -base64 32 | tr '+/' '-_')
          sed -i "s|^NEWSROOM_DOMAIN=.*|NEWSROOM_DOMAIN=:80|" deploy/.env.production
          for k in POSTGRES_SUPERUSER_PASSWORD DB_OWNER_PASSWORD DB_APP_PASSWORD JWT_SECRET API_KEY_PEPPER; do
            sed -i "s|^$k=.*|$k=$(gen)|" deploy/.env.production
          done
          sed -i "s|^MFA_ENCRYPTION_KEY=.*|MFA_ENCRYPTION_KEY=$fernet|" deploy/.env.production
          echo "COOKIE_SECURE=false" >> deploy/.env.production
      - name: Build images
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production build
      - name: Start the stack
        run: |
          C="docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production"
          $C up -d postgres redis
          $C run --rm migrate
          $C up -d
          BOOTSTRAP_PASSWORD='smoke-test-password-123' $C run --rm -T -e BOOTSTRAP_PASSWORD api \
            python -m scripts.bootstrap tenant --slug janaki-tv --name "Janaki Television" \
            --language en --admin-email editor@example.com --admin-name "Smoke Test"
          $C run --rm -T -v "$PWD/deploy/feeds:/feeds:ro" api python -m scripts.bootstrap sources --tenant janaki-tv --file /feeds/approved.json
          sleep 15
          $C ps
      - name: Sign in through Caddy and load the dashboard
        run: |
          set -x
          curl -sf -o /dev/null http://localhost/login
          code=$(curl -s -o /dev/null -w '%{http_code}' -c jar -X POST http://localhost/auth/login \
            -H 'Origin: http://localhost' --data-urlencode tenant_slug=janaki-tv \
            --data-urlencode email=editor@example.com --data-urlencode password=smoke-test-password-123 \
            --data-urlencode next=/)
          test "$code" = "303"
          # An administrator must enrol two-factor first: that screen proves the session works.
          curl -sf -b jar http://localhost/ | grep -q 'Set up two-factor sign-in'
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production exec -T api \
            python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8000/health').read())"
          bash deploy/backup.sh
          ls -la backups/
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production logs --tail 80
