name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql+psycopg://janaki_app:app_dev_pw@localhost:5432/janaki_test
      TEST_DATABASE_OWNER_URL: postgresql+psycopg://janaki_owner:owner_dev_pw@localhost:5432/janaki_test
      DATABASE_OWNER_URL: postgresql+psycopg://janaki_owner:owner_dev_pw@localhost:5432/janaki_test
      LIVE_FETCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create database roles (owner + RLS-enforced app role)
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE janaki_owner LOGIN PASSWORD 'owner_dev_pw';
          CREATE ROLE janaki_app LOGIN PASSWORD 'app_dev_pw' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE janaki_test OWNER janaki_owner;
          SQL
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Migrations match models
        run: alembic upgrade head && alembic check
      - name: Tests (incl. live RSS fetch)
        run: pytest -p no:warnings --cov=app --cov-report=term
